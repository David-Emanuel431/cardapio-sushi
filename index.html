<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardápio Premium</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-color: #050505; --card-bg: #121212; --card-border: #222222; --primary-red: #E63946; --primary-red-hover: #D62828; --text-light: #F8F9FA; --text-muted: #9CA3AF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-light); padding-bottom: 100px; }
        
        .banner { width: 100%; height: 240px; position: relative; background-image: url('https://images.unsplash.com/photo-1579871494447-9811cf80d66c?q=80&w=1000&auto=format&fit=crop'); background-size: cover; background-position: center; }
        .banner::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; background: linear-gradient(to bottom, transparent, var(--bg-color)); }
        .banner-content { position: absolute; bottom: 20px; left: 20px; z-index: 2; }
        .banner-content h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
        
        .nav-categorias-container { position: sticky; top: 0; background-color: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 90; padding: 15px 0; border-bottom: 1px solid var(--card-border); }
        .nav-categorias-wrapper { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .nav-categorias { display: flex; overflow-x: auto; gap: 10px; scrollbar-width: none; }
        .nav-categorias::-webkit-scrollbar { display: none; }
        
        .btn-categoria { background-color: #1A1A1A; color: var(--text-light); border: 1px solid var(--card-border); padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: all 0.2s ease; }
        .btn-categoria.active { background-color: var(--primary-red); border-color: var(--primary-red); color: white; font-weight: 600; }
        
        .menu-container { padding: 10px 20px 20px 20px; max-width: 600px; margin: 0 auto; position: relative; z-index: 3; }
        
        .categoria-titulo { font-size: 22px; font-weight: 600; margin: 30px 0 15px 0; display: flex; align-items: center; gap: 10px; scroll-margin-top: 80px; }
        .categoria-titulo::before { content: ''; display: block; width: 4px; height: 22px; background-color: var(--primary-red); border-radius: 4px; }
        
        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; display: flex; padding: 14px; margin-bottom: 16px; gap: 16px; transition: transform 0.2s ease, border-color 0.2s ease; }
        .foto-produto { width: 110px; height: 110px; border-radius: 14px; object-fit: cover; background-color: #1A1A1A; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .info-produto { display: flex; flex-direction: column; justify-content: space-between; width: 100%; }
        .info-produto h3 { font-size: 16px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
        .descricao { font-size: 13px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .linha-compra { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .preco { font-weight: 700; color: var(--text-light); font-size: 17px; }
        
        .controle-qtd { display: flex; align-items: center; gap: 12px; border: 1px solid var(--card-border); border-radius: 999px; padding: 4px 12px; background: #1A1A1A; }
        .btn-controle { background: none; border: none; font-size: 18px; color: var(--primary-red); cursor: pointer; font-weight: 600; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;}
        .btn-controle.lixeira { color: var(--text-muted); font-size: 14px; }
        .qtd-numero { font-size: 14px; font-weight: 600; min-width: 16px; text-align: center; color: var(--text-light);}
        
        .btn-add-inicial { background-color: var(--primary-red); color: white; border: none; padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3); }
        
        .carrinho-fixo { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: center; z-index: 100; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .carrinho-fixo.visivel { transform: translateY(0); }
        .btn-ver-sacola { width: 100%; max-width: 560px; background-color: var(--primary-red); color: white; border: none; padding: 16px 20px; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4); display: flex; justify-content: space-between; align-items: center; }
        
        .modal-sacola { position: fixed; top: 100%; left: 0; width: 100%; height: 100vh; background: var(--bg-color); z-index: 200; transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; }
        .modal-sacola.aberto { top: 0; }
        .header-sacola { background: var(--card-bg); padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); }
        .header-sacola h2 { font-size: 16px; font-weight: 600; color: var(--text-light); }
        .btn-fechar { background: none; border: none; font-size: 24px; color: var(--text-light); cursor: pointer; }
        .lista-sacola { flex: 1; overflow-y: auto; padding: 20px; background: var(--bg-color); }
        .item-sacola { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); margin-bottom: 20px;}
        .item-sacola-info h4 { font-size: 15px; font-weight: 500; margin-bottom: 6px; color: var(--text-light);}
        .item-sacola-preco { color: var(--text-muted); font-size: 14px;}
        .resumo-sacola { background: var(--card-bg); padding: 25px 20px 40px 20px; border-top: 1px solid var(--card-border);}
        .linha-resumo { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: var(--text-muted);}
        .linha-total { font-weight: 600; font-size: 18px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); color: var(--text-light);}
        .btn-continuar { width: 100%; background-color: var(--primary-red); color: white; border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4);}
        .mensagem-erro { color: #ffb703; padding: 40px 20px; text-align: center; font-weight: 500;}
    </style>
</head>
<body>

    <header class="banner">
        <div class="banner-content">
            <h1>Sushi Delivery</h1>
            <p style="color: #bbb; font-size: 14px;">O melhor da culinária oriental 🥢</p>
        </div>
    </header>

    <div class="nav-categorias-container" id="nav-categorias-container" style="display: none;">
        <div class="nav-categorias-wrapper">
            <div class="nav-categorias" id="nav-categorias">
                <!-- Botões gerados via JS -->
            </div>
        </div>
    </div>

    <main class="menu-container" id="menu-container">
        <div class="mensagem-erro">A preparar o menu...</div>
    </main>

    <div class="carrinho-fixo" id="barra-carrinho">
        <button class="btn-ver-sacola" onclick="abrirSacola()">
            <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2;">
                <span style="font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.8);">Total sem a entrega</span>
                <span id="resumo-barra-total" style="margin-top: 2px;">R$ 0,00</span>
            </span>
            <span>Ver sacola</span>
        </button>
    </div>

    <div class="modal-sacola" id="modal-sacola">
        <div class="header-sacola">
            <button class="btn-fechar" onclick="fecharSacola()">&#10005;</button>
            <h2>SACOLA</h2>
            <button style="background:none; border:none; color: var(--primary-red); font-weight:600; cursor: pointer;" onclick="limparSacola()">Limpar</button>
        </div>
        <div class="lista-sacola" id="lista-sacola"></div>
        <div class="resumo-sacola">
            <div class="linha-resumo"><span>Subtotal</span><span id="sacola-subtotal">R$ 0,00</span></div>
            <div class="linha-resumo"><span>Taxa de entrega</span><span>A combinar</span></div>
            <div class="linha-resumo linha-total"><span>Total</span><span id="sacola-total">R$ 0,00</span></div>
            <button class="btn-continuar" onclick="enviarParaWhatsApp()">Continuar Pedido</button>
        </div>
    </div>

    <script>
        let carrinho = {}; 
        const numeroWhatsApp = "5586999999999"; 
        
        // === COLE O SEU LINK DA PLANILHA AQUI ===
        const LINK_PLANILHA_CSV = "COLE_O_SEU_LINK_AQUI"; 
        
        let produtosGlobais = [];

        document.addEventListener("DOMContentLoaded", () => {
            if(LINK_PLANILHA_CSV === "COLE_O_SEU_LINK_AQUI") {
                 document.getElementById('menu-container').innerHTML = `<div class="mensagem-erro">Cole o link da Planilha CSV (linha 158).</div>`;
                 return;
            }
            carregarPlanilha();
        });

        async function carregarPlanilha() {
            try {
                const antiCache = new Date().getTime(); 
                const linkComAntiCache = `${LINK_PLANILHA_CSV}&v=${antiCache}`;

                const resposta = await fetch(linkComAntiCache);
                const dadosTexto = await resposta.text();
                processarCSV(dadosTexto);
            } catch (erro) {
                document.getElementById('menu-container').innerHTML = `<div class="mensagem-erro">Erro ao carregar o menu. Verifique se o link está correto.</div>`;
            }
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function gerarIdCategoria(texto) {
            if (!texto) return "cat-padrao";
            return "cat-" + texto.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, '-').toLowerCase();
        }

        // Leitor "Blindado" de CSV - Não quebra com aspas ou vírgulas nas descrições
        function lerLinhaCSV(texto) {
            let resultado = [];
            let entreAspas = false;
            let valorAtual = '';
            for (let i = 0; i < texto.length; i++) {
                let caractere = texto[i];
                if (entreAspas) {
                    if (caractere === '"') {
                        if (i + 1 < texto.length && texto[i+1] === '"') { valorAtual += '"'; i++; } 
                        else { entreAspas = false; }
                    } else { valorAtual += caractere; }
                } else {
                    if (caractere === '"') { entreAspas = true; } 
                    else if (caractere === ',') { resultado.push(valorAtual.trim()); valorAtual = ''; } 
                    else { valorAtual += caractere; }
                }
            }
            resultado.push(valorAtual.trim());
            return resultado;
        }

        function processarCSV(textoCSV) {
            const linhas = textoCSV.split('\n');
            produtosGlobais = [];
            for (let i = 1; i < linhas.length; i++) {
                let linhaStr = linhas[i].trim();
                if (!linhaStr) continue;
                
                let colunas = lerLinhaCSV(linhaStr);
                
                // Preenche as colunas vazias para não dar erro
                while(colunas.length < 6) { colunas.push(""); }

                const disponivel = colunas[5].toLowerCase();
                if (disponivel === "sim" || disponivel === "s" || disponivel === "true") {
                    
                    let precoLimpo = colunas[3].replace(/[R$\s]/g, '').replace(',', '.');
                    if((precoLimpo.match(/\./g) || []).length > 1) {
                         precoLimpo = precoLimpo.replace('.', '');
                    }
                    
                    let nomeProduto = colunas[1] || "Produto Sem Nome";
                    
                    produtosGlobais.push({
                        id: nomeProduto,
                        categoria: colunas[0] || "Outros",
                        nome: nomeProduto,
                        descricao: colunas[2] || "",
                        preco: parseFloat(precoLimpo) || 0,
                        foto: colunas[4] || ""
                    });
                }
            }
            renderizarCards();
        }

        function renderizarCards() {
            const container = document.getElementById('menu-container');
            const navContainer = document.getElementById('nav-categorias');
            const navWrapper = document.getElementById('nav-categorias-container');
            
            container.innerHTML = ""; 
            navContainer.innerHTML = "";
            
            if(produtosGlobais.length === 0) {
                 navWrapper.style.display = 'none';
                 container.innerHTML = `<div class="mensagem-erro">Nenhum produto encontrado. A coluna "Disponivel" precisa ter a palavra "Sim".</div>`;
                 return;
            }

            navWrapper.style.display = 'block';

            let categoriaAtual = "";
            let categoriasUnicas = [];

            produtosGlobais.forEach((produto, index) => {
                if (produto.categoria !== categoriaAtual) {
                    categoriasUnicas.push(produto.categoria);
                    const catId = gerarIdCategoria(produto.categoria);
                    container.innerHTML += `<h2 class="categoria-titulo" id="${catId}">${produto.categoria}</h2>`;
                    categoriaAtual = produto.categoria;
                }
                
                const imagemSrc = produto.foto.length > 5 ? produto.foto : 'https://via.placeholder.com/200x200/1a1a1a/e63946?text=Sushi';
                const qtd = carrinho[produto.id] ? carrinho[produto.id].quantidade : 0;
                
                let controlesHTML = ``;
                if(qtd === 0) {
                    controlesHTML = `<button class="btn-add-inicial" onclick="alterarQtd('${produto.id}', 1)">Adicionar</button>`;
                } else {
                    const iconeMenos = qtd === 1 ? '🗑️' : '−';
                    const classeLixeira = qtd === 1 ? 'lixeira' : '';
                    controlesHTML = `
                        <div class="controle-qtd">
                            <button class="btn-controle ${classeLixeira}" onclick="alterarQtd('${produto.id}', -1)">${iconeMenos}</button>
                            <span class="qtd-numero">${qtd}</span>
                            <button class="btn-controle" onclick="alterarQtd('${produto.id}', 1)">+</button>
                        </div>
                    `;
                }

                const cardHTML = `
                    <div class="card">
                        <img src="${imagemSrc}" alt="${produto.nome}" class="foto-produto">
                        <div class="info-produto">
                            <div>
                                <h3>${produto.nome}</h3>
                                <p class="descricao">${produto.descricao}</p>
                            </div>
                            <div class="linha-compra" id="controle-card-${index}">
                                <span class="preco">${formatarMoeda(produto.preco)}</span>
                                ${controlesHTML}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

            categoriasUnicas.forEach((cat, index) => {
                const catId = gerarIdCategoria(cat);
                const activeClass = index === 0 ? 'active' : '';
                let icone = "🍱";
                if(cat.toLowerCase().includes("combo")) icone = "🍣";
                if(cat.toLowerCase().includes("temaki")) icone = "🍙";
                if(cat.toLowerCase().includes("bebida")) icone = "🥤";
                if(cat.toLowerCase().includes("entrada") || cat.toLowerCase().includes("hot")) icone = "🥟";
                if(cat.toLowerCase().includes("sobremesa")) icone = "🍰";

                navContainer.innerHTML += `<button class="btn-categoria ${activeClass}" onclick="scrollToCategoria('${catId}', this)">${icone} ${cat}</button>`;
            });
        }

        function scrollToCategoria(id, elementoBotao) {
            const destino = document.getElementById(id);
            if(destino) {
                destino.scrollIntoView({ behavior: 'smooth' });
            }
            document.querySelectorAll('.btn-categoria').forEach(btn => btn.classList.remove('active'));
            elementoBotao.classList.add('active');
            elementoBotao.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        function alterarQtd(idProduto, mudanca) {
            if (!carrinho[idProduto]) {
                const produtoInfo = produtosGlobais.find(p => p.id === idProduto);
                carrinho[idProduto] = { ...produtoInfo, quantidade: 0 };
            }
            carrinho[idProduto].quantidade += mudanca;
            if (carrinho[idProduto].quantidade <= 0) {
                delete carrinho[idProduto];
            }
            atualizarTudo();
        }

        function atualizarTudo() {
            renderizarCards(); 
            let totalItens = 0;
            let valorTotal = 0;
            for (let id in carrinho) {
                totalItens += carrinho[id].quantidade;
                valorTotal += (carrinho[id].preco * carrinho[id].quantidade);
            }
            const barra = document.getElementById('barra-carrinho');
            if (totalItens > 0) {
                barra.classList.add('visivel');
                document.getElementById('resumo-barra-total').innerText = formatarMoeda(valorTotal) + ` / ${totalItens} item(s)`;
            } else {
                barra.classList.remove('visivel');
                fecharSacola(); 
            }
            renderizarSacola(valorTotal);
        }

        function renderizarSacola(valorTotal) {
            const containerSacola = document.getElementById('lista-sacola');
            containerSacola.innerHTML = "";
            for (let id in carrinho) {
                const item = carrinho[id];
                const iconeMenos = item.quantidade === 1 ? '🗑️' : '−';
                const classeLixeira = item.quantidade === 1 ? 'lixeira' : '';
                containerSacola.innerHTML += `
                    <div class="item-sacola">
                        <div class="item-sacola-info">
                            <h4>${item.nome}</h4>
                            <div class="item-sacola-preco">${formatarMoeda(item.preco)}</div>
                        </div>
                        <div class="controle-qtd">
                            <button class="btn-controle ${classeLixeira}" onclick="alterarQtd('${item.id}', -1)">${iconeMenos}</button>
                            <span class="qtd-numero">${item.quantidade}</span>
                            <button class="btn-controle" onclick="alterarQtd('${item.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('sacola-subtotal').innerText = formatarMoeda(valorTotal);
            document.getElementById('sacola-total').innerText = formatarMoeda(valorTotal);
        }

        function abrirSacola() { document.getElementById('modal-sacola').classList.add('aberto'); }
        function fecharSacola() { document.getElementById('modal-sacola').classList.remove('aberto'); }
        function limparSacola() { carrinho = {}; atualizarTudo(); }

        function enviarParaWhatsApp() {
            let textoMensagem = "🍣 *NOVO PEDIDO* 🍣%0A%0A";
            let valorTotal = 0;
            for (let id in carrinho) {
                const item = carrinho[id];
                const subtotalItem = item.preco * item.quantidade;
                valorTotal += subtotalItem;
                textoMensagem += `▪️ ${item.quantidade}x ${item.nome} (${formatarMoeda(subtotalItem)})%0A`;
            }
            textoMensagem += `%0A💰 *Total dos itens: ${formatarMoeda(valorTotal)}*`;
            textoMensagem += "%0A🛵 *Entrega: a combinar*";
            textoMensagem += "%0A%0A*Por favor, confirmem o meu pedido.*";
            const linkWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${textoMensagem}`;
            window.open(linkWhatsApp, '_blank');
        }
    </script>
</body>
</html>
